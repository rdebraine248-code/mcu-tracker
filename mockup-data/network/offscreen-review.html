const TIES = [{"n": 2, "a": "Bruce Banner", "b": "Dr. Abraham Erskine", "t": "The Avengers", "how": "stated", "p": "Coulson tells Steve that Banner thought gamma radiation might hold the key to unlocking Erskine's original formula, which is what Banner was working on when he became the Hulk.", "src": "https://www.springfieldspringfield.co.uk/movie_script.php?movie=avengers-the-2012", "flag": ""}, {"n": 3, "a": "Loki", "b": "Dreykov", "t": "The Avengers", "how": "stated", "p": "Loki taunts Natasha about the red in her ledger by naming Dreykov's daughter, a secret he says Barton told him.", "src": "https://screenrant.com/black-widow-budapest-mystery-answered-dreykov-mission/", "flag": ""}, {"n": 4, "a": "Loki", "b": "Taskmaster", "t": "The Avengers", "how": "implied", "p": "Loki throws Dreykov's daughter in Natasha's face, and that daughter is Antonia, the girl Natasha believed she killed in Budapest who later became Taskmaster.", "src": "https://screenrant.com/black-widow-budapest-mystery-answered-dreykov-mission/", "flag": "Thin, or one source"}, {"n": 5, "a": "Pepper Potts", "b": "Audrey Nathan", "t": "The Avengers", "how": "implied", "p": "Pepper asks Coulson about the cellist he is seeing, and Coulson says she moved back to Portland; that cellist is Audrey Nathan.", "src": "https://movieweb.com/amy-acker-revealed-as-coulsons-cellist-girlfriend-in-marvels-agents-of-s-h-i-e-l-d/", "flag": "Thin, or one source"}, {"n": 6, "a": "Tony Stark", "b": "Audrey Nathan", "t": "The Avengers", "how": "implied", "p": "After Coulson dies, Steve asks if he was married and Tony answers no, there was a cellist, I think, meaning Coulson's girlfriend Audrey Nathan.", "src": "https://www.springfieldspringfield.co.uk/movie_script.php?movie=avengers-the-2012", "flag": "Thin, or one source"}, {"n": 7, "a": "Arnim Zola", "b": "Maria Stark", "t": "Captain America: The Winter Soldier", "how": "implied", "p": "While explaining how Hydra changed history, Zola says accidents will happen as a newspaper clipping about the Starks' fatal car crash appears on his screen, hinting Hydra had Maria and Howard Stark killed.", "src": "https://www.denofgeek.com/us/movies/marvel/273095/a-captain-america-civil-war-detail-you-might-have-missed", "flag": ""}, {"n": 8, "a": "Phil Coulson", "b": "Emil Blonsky", "t": "The Consultant", "how": "stated", "p": "Coulson tells Sitwell the World Security Council wants Blonsky exonerated, released and added to the Avengers roster, and later reports that Blonsky will stay in his cage.", "src": "https://www.springfieldspringfield.co.uk/movie_script.php?movie=marvel-one-shot-the-consultant", "flag": ""}, {"n": 9, "a": "Jasper Sitwell", "b": "Emil Blonsky", "t": "The Consultant", "how": "stated", "p": "Sitwell discusses Blonsky with Coulson, calling him the Abomination and plotting with Coulson to keep the Council from getting him released.", "src": "https://www.springfieldspringfield.co.uk/movie_script.php?movie=marvel-one-shot-the-consultant", "flag": ""}, {"n": 10, "a": "Phil Coulson", "b": "Thaddeus Ross", "t": "The Consultant", "how": "stated", "p": "Coulson explains that Blonsky is in General Ross's custody and that S.H.I.E.L.D. must send a liaison to Ross, so he sends Tony Stark to annoy Ross into refusing.", "src": "https://www.springfieldspringfield.co.uk/movie_script.php?movie=marvel-one-shot-the-consultant", "flag": ""}, {"n": 13, "a": "Valentina Allegra de Fontaine", "b": "Clint Barton", "t": "Black Widow (Post-Credits Scene)", "how": "stated", "p": "At Natasha's grave, Valentina tells Yelena that Clint Barton is the man responsible for her sister's death and offers her the chance to go after him.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Valentina_Allegra_de_Fontaine", "flag": ""}, {"n": 14, "a": "Valentina Allegra de Fontaine", "b": "Natasha Romanoff", "t": "Black Widow (Post-Credits Scene)", "how": "stated", "p": "Valentina pays her respects at Natasha Romanoff's grave and talks to Yelena about her sister's death.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Valentina_Allegra_de_Fontaine", "flag": ""}, {"n": 16, "a": "Wenwu", "b": "Aldrich Killian", "t": "Shang-Chi and the Legend of the Ten Rings", "how": "implied", "p": "Wenwu tells Katy that an American terrorist stole his Ten Rings legend and invented the name Mandarin for a figurehead, describing Killian's scheme without saying his name.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Aldrich_Killian", "flag": ""}, {"n": 17, "a": "Pip the Troll", "b": "Thanos", "t": "Eternals", "how": "stated", "p": "In the mid-credits scene Pip introduces Eros to the Eternals as the royal prince of Titan and brother of Thanos.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Starfox", "flag": ""}, {"n": 19, "a": "Gilgamesh", "b": "Odin", "t": "Eternals", "how": "stated", "p": "While cooking for the other Eternals, Gilgamesh tells them about a secret brew recipe Odin taught him after the Eternals helped Asgard in battle.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Gilgamesh", "flag": ""}, {"n": 20, "a": "Gilgamesh", "b": "Laufey", "t": "Eternals", "how": "stated", "p": "Gilgamesh recalls that the brew recipe came from Odin after the Eternals helped defeat Laufey's army.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Gilgamesh", "flag": "Thin, or one source"}, {"n": 21, "a": "Kingo", "b": "Thor", "t": "Eternals", "how": "stated", "p": "During the dinner at Gilgamesh's house, Kingo says he knew Thor as a child and that the young Thor used to follow him around.", "src": "https://www.complex.com/pop-culture/a/kevin-wong/marvels-eternals-easter-eggs-references", "flag": ""}, {"n": 22, "a": "Agent Cleary", "b": "Nick Fury", "t": "Spider-Man: No Way Home", "how": "stated", "p": "When Peter says Nick Fury can back up his story, Cleary replies that Fury has been off-world for a year.", "src": "https://looper.com/710956/spider-man-no-way-home-finally-confirms-what-happened-to-nick- r. Wilfred Nagel boasts that by recreating the super soldier serum he did what no other scientist since Erskine had been able to do.", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=the-falcon-and-the-winter-soldier-2021&episode=s01e03", "flag": ""}, {"n": 29, "a": "Classic Loki", "b": "Thanos", "t": "Loki S1", "how": "stated", "p": "In episode 5, Classic Loki explains that in his timeline Thanos attacked their ship, and he survived by casting a projection so real that even the Mad Titan believed he had died.", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=loki-2021&episode=s01e05", "flag": "Variant: their own branch's Thor or Thanos"}, {"n": 30, "a": "Classic Loki", "b": "Thor", "t": "Loki S1", "how": "stated", "p": "In episode 5, Classic Loki says that after faking his death he drifted in space, away from Thor and away from everything.", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=loki-2021&episode=s01e05", "flag": "Variant: their own branch's Thor or Thanos"}, {"n": 31, "a": "Kid Loki", "b": "Thor", "t": "Loki S1", "how": "stated", "p": "In episode 5, Kid Loki says his nexus event was that he killed Thor (the Thor of his own branch).", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=loki-2021&episode=s01e05", "flag": "Variant: their own branch's Thor or Thanos"}, {"n": 32, "a": "Gravik", "b": "Carol Danvers", "t": "Secret Invasion", "how": "implied", "p": "In the 1997 flashback of episode 2, young Gravik is among the Skrull refugees when Nick Fury promises that he and Carol Danvers will find them a new home, and that broken promise drives Gravik, who later takes the Harvest containing Carol Danvers' DNA.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Promises", "flag": ""}, {"n": 34, "a": "Nick Fury", "b": "Dreykov", "t": "Secret Invasion", "how": "implied", "p": "In a 1998 flashback in episode 3, Nick Fury meets Varra to trade intelligence on General Dreykov, and she tells him it should put Dreykov's men on their heels.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Betrayed", "flag": ""}, {"n": 36, "a": "Wilson Fisk", "b": "Valentina Allegra de Fontaine", "t": "Daredevil: Born Again S2", "how": "implied", "p": "In the season 2 premiere, Attorney General Steverud resists Mayor Fisk's anti-vigilante plans until he takes a phone call from Miss de Fontaine, after which he promises Fisk his office's full support.", "src": "https://slashfilm.com/2129629/daredevil-born-again-season-2-marvel-thunderbolts-valentina-allegra-la-fontaine", "flag": ""}, {"n": 38, "a": "Ezekiel Stane", "b": "Tony Stark", "t": "Ironheart", "how": "implied", "p": "In episode 3, Ezekiel Stane tells Riri that the plane crash story is a lie and that his dad died trying to kill Tony Stark.", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=ironheart-2025&episode=s01e03", "flag": ""}, {"n": 39, "a": "J.A.R.V.I.S.", "b": "Edwin Jarvis", "t": "VisionQuest", "how": "stated", "p": "In episode 4, while going through Stark's old records, the AIs learn that Tony Stark based each of them on a real person, with J.A.R.V.I.S. modeled on Edwin Jarvis, the Stark family butler.", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=visionquest-2026&episode=s01e04", "flag": ""}, {"n": 43, "a": "Vision", "b": "Raza", "t": "VisionQuest", "how": "stated", "p": "In episode 6, Raza, the Ten Rings leader from Iron Man, arrives with an armed team to take the bounty and demands that Paladin hand over Vision alive.", "src": "https://www.tvline.com/2298385/marvel-visionquest-iron-man-villain-raza-return-explained/", "flag": "VisionQuest's Vision may be White Vision"}, {"n": 47, "a": "Matt Murdock", "b": "Carl Creel", "t": "Daredevil S1", "how": "stated", "p": "Young Matt sobs to Stick that his dad was paid to lose against Creel but won because Matt wanted him to, and was killed for it.", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=daredevil-2015&episode=s01e07", "flag": ""}, {"n": 48, "a": "Elektra Natchios", "b": "Jack Murdock", "t": "Daredevil S2", "how": "implied", "p": "In a flashback, Elektra tracks down and ties up Roscoe Sweeney, \"the son of a bitch who killed your father,\" and urges Matt to beat him \"for your father.\"", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Kinbaku", "flag": ""}, {"n": 50, "a": "Pop", "b": "Jessica Jones", "t": "Luke Cage S1", "how": "implied", "p": "Pop teases Luke about his rebound chick who put a shotgun under his chin at point-blank range and pulled the trigger, a nod to Jessica Jones.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Pop", "flag": ""}, {"n": 51, "a": "Priscilla Ridley", "b": "Karen Page", "t": "Luke Cage S2", "how": "stated", "p": "After the Rum Punch Massacre, Ridley tells Misty that Bulletin reporter Karen Page just called her for a quote about a living witness.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/Priscilla_Ridley", "flag": ""}, {"n": 52, "a": "Joy Meachum", "b": "Jessica Jones", "t": "Iron Fist S1", "how": "implied", "p": "Joy shows Ward blackmail dirt on the Rand board gathered by the private investigator she hired, Jessica Jones, who she says was worth every penny when she was sober.", "src": "https://marvelcinematicuniverse.fandom.com/wiki/The_Blessing_of_Many_Fractures", "flag": ""}, {"n": 54, "a": "Jessica Jones", "b": "Jack Murdock", "t": "The Defenders", "how": "implied", "p": "After Matt tells Lexi Raymond about a friend whose boxer dad was killed, Jessica lets on that she dug into the story of Matt's father, saying \"You took my case, I took yours.\"", "src": "https://www.springfieldspringfield.co.uk/view_episode_scripts.php?tv-show=marvels-the-defenders-2017&episode=s01e06", "flag": ""}, {"n": 56, "a": "John Garrett", "b": "Alexander Pierce", "t": "Agents of S.H.I.E.L.D.", " const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function render() {
  const x = TIES[at], d = dec["t" + x.n];
  $("card").innerHTML = `<div class="num">Tie ${x.n} · ${at + 1} of ${TIES.length}</div><div class="who"><span>${esc(x.a)}</span><span class="and">and</span><span>${esc(x.b)}</span></div>
    <div class="chips"><span>${esc(x.t)}</span><span class="${x.how}">${x.how}</span>${x.flag ? `<span class="fl">${esc(x.flag)}</span>` : ""}</div><p>${esc(x.p)}</p><a class="src" href="${esc(x.src)}" target="_blank" rel="noopener">Source</a>`;
  $("bKeep").setAttribute("aria-pressed", d === "keep"); $("bCut").setAttribute("aria-pressed", d === "cut"); $("bPrev").disabled = at === 0;
  const k = Object.values(dec).filter(v => v === "keep").length, c = Object.values(dec).filter(v => v === "cut").length;
  $("count").textContent = `${k + c} of ${TIES.length} decided · ${k} kept · ${c} cut`; $("tk").style.width = (k / TIES.length * 100) + "%"; $("tc").style.width = (c / TIES.length * 100) + "%";
  $("all").innerHTML = TIES.map((y, i) => { const v = dec["t" + y.n]; return `<li><button type="button" data-i="${i}" class="${i === at ? "on" : ""}"><span class="n">${y.n}</span><span>${esc(y.a)} and ${esc(y.b)}</span><span class="st ${v || ""}">${v || "open"}</span></button></li>`; }).join("");
}
async function choose(v) {
  const x = TIES[at], key = "t" + x.n; dec[key] = v; render();
  if (db) { try { await db.doc("decisions/" + key).set({ n: x.n, a: x.a, b: x.b, decision: v }); $("note").textContent = "Saved."; }
    catch (e) { $("note").textContent = "That didn't save. Try again in a moment."; } }
  else $("note").textContent = "Not saved: open this page signed in to keep your choices.";
  setTimeout(next, 260);
}
function next() { for (let s = 1; s <= TIES.length; s++) { const i = (at + s) % TIES.length; if (!dec["t" + TIES[i].n]) { at = i; render(); return; } } $("note").textContent = "All decided. Tell me when you're done."; }
$("bKeep").onclick = () => choose("keep"); $("bCut").onclick = () => choose("cut");
$("bPrev").onclick = () => { if (at > 0) { at--; render(); } }; $("bNext").onclick = next;
$("all").onclick = e => { const b = e.target.closest("[data-i]"); if (b) { at = +b.dataset.i; render(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
document.addEventListener("keydown", e => { if (e.target.closest("input,textarea")) return; if (e.key === "k") choose("keep"); else if (e.key === "c") choose("cut"); else if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft" && at > 0) { at--; render(); } });
render();
(async () => { try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { $("note").textContent = "Open this page signed in to save your choices."; return; }
  const t = setTimeout(() => { $("note").textContent = "Your saved choices are taking a while to load."; }, 10000);
  db.collection("decisions").onSnapshot(s => { clearTimeout(t); dec = {}; s.docs.forEach(d => { const v = d.data(); if (v && v.decision) dec[d.id] = v.decision; }); render(); },
    () => { clearTimeout(t); $("note").textContent = "Couldn't load your saved choices."; }); })();
