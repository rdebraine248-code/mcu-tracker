 in Edinburgh and later tries to take the Mind Stone in Wakanda. Vision kills him."]]],[475,90,[[7,42,"Corvus Glaive ambushes Wanda Maximoff and Vision in Edinburgh, stabbing Vision as he is about to answer her. He and Proxima Midnight nearly kill them both before Steve Rogers' team arrives."]]],[102,101,[[2,3,"Kraglin and Cosmo watch over Knowhere together while the Guardians go to save Rocket. They bicker, and he hurts her feelings by calling her a \"bad dog,\" but at Christmas she gives him an Orloni she hunted as a present."]]],[102,109,[[5,3,"When Cosmo strains to hold two ships together so the rescued children can cross to Knowhere, Mantis uses her powers to give her more strength."]]],[102,94,[[5,3,"Cosmo joins the Guardians at their base on Knowhere. Quill leaves her and Kraglin to guard Knowhere, and she later links the two ships so Quill can bring the rescued children home."]]],[102,97,[[5,3,"Rocket and Cosmo snarl at each other when they first cross paths in the Collector's museum. Later they rebuild Knowhere together, and Cosmo stays on in the new Guardians team Rocket leads."]]],[102,632,[[4,74,"The Collector finds Cosmo drifting in space and keeps her on display in his museum on Knowhere. After the museum is wrecked, she tries to comfort him by licking his face."]]],[102,508,[[7,3,"When the High Evolutionary's forces attack Knowhere, Cosmo helps fend them off and uses her powers to keep his ship from crashing into it."]]],[562,565,[[2,58,"Diamondback is Cottonmouth's old friend and his gun supplier, and he even gave him the Biggie Smalls poster that hangs in his office. After Cottonmouth dies, Diamondback moves in on his criminal empire."]]],[562,645,[[6,58,"Domingo Colon is an old friend turned rival of Cottonmouth's in Harlem's drug trade."]]],[562,345,[[7,58,"Cornell Stokes, called Cottonmouth, is Luke's former employer at Harlem's Paradise. He becomes Luke's first big enemy after his men kill Pop."]]],[562,563,[[0,58,"Cornell Stokes and Mariah Dillard are cousins who run the family's business together. She kills him in a fit of rage."]]],[562,360,[[7,58,"Misty investigates Cottonmouth and the Stokes crime family throughout her work in Harlem. In the end she arrests him at Harlem's Paradise for the murder of her partner Rafael Scarfe."]]],[562,361,[[2,58,"Pop knew Cornell Stokes since Cornell was young, and he keeps a fragile peace with him as a customer. In the end Cottonmouth's men kill Pop."]]],[562,566,[[4,58,"Detective Rafael Scarfe is a dirty cop on Cottonmouth's payroll. Cottonmouth shoots him."]]],[562,564,[[5,58,"Shades brings Diamondback's guns to Cottonmouth and works alongside him."]]],[562,568,[[0,59,"Cottonmouth is related to Tilda Johnson through the Stokes family, as both her uncle and her cousin."]]],[562,644,[[4,58,"Tone is Cottonmouth's bodyguard. Cottonmouth kills him for shooting up Pop's Barber Shop."]]],[562,549,[[5,58,"Turk Barrett tips off Cottonmouth's people about the man who robbed Cottonmouth, hoping to collect the reward."]]],[562,670,[[4,58,"Zip is one of Cottonmouth's enforcers, a thug with bigger ambitions than his job. After Cottonmouth's murder, Zip switches sides to Diamondback."]]],[476,473,[[0,42,"Ebony Maw and Cull Obsidian are adopted brothers, both raised by Thanos to fight in the Black Order. On the Statesman Maw holds Cull back from helping Thanos against the Hulk, and the two then go to New York together to take the Time Stone."]]],[476,95,[[0,42,"Cull Obsidian and Gamora are both adopted children of Thanos, though Gamora wants nothing to do with him or the rest of the Black Order."]]],[476,100,[[0,42,"Cull Obsidian and Nebula are both adopted children of Thanos, though Nebula despises him and the rest of the Black Order."]]],[476,150,[[7,42,"Spider-Man joins the fight against Cull Obsidian in Greenwich Village, catching a hammer blow meant for Tony Stark before being thrown across the park."]]],[476,474,[[0,42,"Cull Obsidian and Proxima Midnight are adopted siblings in Thanos' Black Order. Together they lead the attack on Wakanda, demanding the Mind Stone and unleashing the Outriders when T'Challa refuses."]]],[476,123,[[7,13,"During the Battle of Earth, Scott helps Spider-Man by crushing Cull Obsidian under his giant foot."]]],[476,161,[[7,42,"Cull Obsidian comes after the Time Stone around Doctor Strange's neck when the Black Order lands in Greenwich Village. Strange fights him off alongside Tony Stark and Wong before Ebony Maw carries Strange away."]]],[476,429,[[0,42,"Cull Obsidian is one of the orphans Thanos takes from a conquered world and raises as a child in the Black Order. He fights at his father's side on the Statesman and leads his assault in New York and Wakanda in the hunt for the Infinity Stones."]]],[476,52,[[7,42,"Cull Obsidian attacks Tony Stark, Stephen Strange and Wong in New York when Thanos' Children come for the Time Stone. Wong ends the fight by sending him through a portal."]]],[476,485,[[7,42,"During the Battle of Wakanda, Cull Obsidian joins Corvus Glaive in attacking Vision in the forest, battering him with his hammer to get at the Mind Stone."]]],[476,162,[[7,42,"Wong fights Cull Obsidian when the Black Order invades Greenwich Village. He gets rid of him by dropping him through a portal and snapping it shut on his arm."]]],[378,379,[[5,55,"Curtis Hoyle and Micro start out suspicious of each other. They end up working together to help Frank."]]],[378,381,[[5,31,"Dinah Madani seeks out Curtis Hoyle, Frank's friend, for answers about Billy Russo's past, since Russo has shot them both. The two then work together to protect Amy Bendix from John Pilgrim while Frank hunts Russo."]]],[378,377,[[2,55,"Curtis Hoyle is Frank's fellow veteran and closest friend. He runs a support group and gives Frank medical help and advice."]]],[378,579,[[7,31,"John Pilgrim hunts Amy Bendix, and Curtis Hoyle works to keep her out of his reach. When Pilgrim tracks Frank Castle to a trailer, he finds Curtis there instead, and the two men size each other up."]]],[378,578,[[3,55,"Curtis Hoyle counsels Lewis Wilson through his PTSD in his support group for veterans and talks with him one on one. Lewis misreads Curtis's advice and slides into extremism, becoming the bomber terrorizing New York."]]],[365,345,[[2,58,"D.W. Griffith is a young fan of Luke's who sells his videos and cheers him on. He also helps out Bobby Fish."]]],[0,32,[[1,27,"Daniel Sousa joins the team after they save him from his own death in 1955. He and Daisy Johnson fall for each other while fighting the Chronicoms across time."]]],[0,593,[[7,25,"Daniel Whitehall wants Daisy Johnson, then known as Skye, brought to him, since decades earlier he cut open her mother, Jiaying, to steal her youth. Coulson kills him when the team storms his base to get Skye back."]]],[0,379,[[5,25,"Micro is one of Skye's hacker contacts from the Rising Tide. He sends her photos of a murder victim carved with strange alien symbols, which puts Coulson's team on the killer's trail."]]],[0,24,[[5,8,"Agent Davis works alongside Daisy on S.H.I.E.L.D. missions, such as tracking down L.T. Koenig and the Darkhold."],[5,28,"Davis joins Daisy on the long search through space for Leo Fitz."]]],[0,9,[[2,26,"Deke Shaw has an obvious crush on Daisy Johnson from the day they meet in the future. She never returns it, but they end up good friends and teammates."]]],[0,623,[[5,11,"Skye first meets Donnie Gill as a troubled S.H.I.E.L.D. Academy cadet and comforts him after his only friend dies."],[7,25,"Once HYDRA brainwashes Donnie, he tries to freeze a ship full of people, and Skye stops him with a sniper shot that sends him into the sea."]]],[0,5,[[2,9,"Elena Rodriguez and Daisy Johnson are friends and fellow Inhumans. Daisy recruits Elena for the Secret Warriors."]]],[0,30,[[2,26,"Enoch, a Chronicom, becomes a loyal friend to Daisy and the team on their trips through space and time."],[2,27,"Enoch sacrifices himself to free Daisy and Phil Coulson from a time loop, saying it has been a privilege to be part of their family."]]],[0,19,[[5,11,"Eric Koenig welcomes Skye and Coulson's team to Providence, one of Nick Fury's secret bases, and questions each of them before handing out lanyards. Soon after, Skye finds his body hidden in a closet and realizes Grant Ward killed him."]]],[0,88,[[5,11,"Felix Blake is a senior S.H.I.E.L.D. agent who watches Skye become a Level 1 agent."],[7,9,"Felix Blake resurfaces with the anti-Inhuman Watchdogs, and Daisy tracks him down."]]],[0,14,[[2,8,"Daisy gets to know Gabe Reyes while working with his brother Robbie, the Ghost Rider, and stops a group of thugs from stealing his wheelchair. Later she flies Gabe out to Zephyr One so he can see Robbie."]]],[0,669,[[7,9,"Gideon Malick tries to have Daisy Johnson killed. Under Hive's control, she kills him."]]],[0,612,[[7,8,"A robot copy of Daisy Johnson shoots Glenn Talbot in the head."],[7,26,"As Graviton, Talbot fights Daisy, and she kills him."]]],[0,599,[[5,25,"Gordon, the eyeless teleporter from Afterlife, finds Daisy Johnson after her change and brings her to Jiaying's haven. He stays loyal to Jiaying when she goes to war with S.H.I.E.L.D., which puts him on the opposite side from Daisy."]]],[0,588,[[3,11,"Grant Ward is Skye's first supervising officer, and the two grow close while he trains her in the field."],[7,11,"When Ward is exposed as HYDRA, Skye turns on him."],[7,25,"When Ward delivers Skye to her father, she shoots him four times."]]],[0,610,[[7,26,"General Hale blames Daisy for shooting Glenn Talbot, orders S.H.I.E.L.D. arrested, and secretly leads Hydra. She even plans to turn Quake into a weapon with Gravitonium, but when her daughter Ruby spins out of control, Hale surrenders to Daisy and helps her storm the Hydra base."]]],[0,601,[[5,9,"Daisy Johnson and Lincoln Campbell go to James, a loner from Afterlife, for help finding a Kree relic. Later, as Hellfire, he serves Hive alongside the Daisy that Hive controls."],[7,8,"James comes to hate all Inhumans and blames Daisy for what he suffered, and he betrays her to the Watchdogs."]]],[0,589,[[7,9,"Hive takes control of Daisy Johnson's mind. When she breaks free, she joins the fight to destroy him."]]],[0,606,[[7,9,"While under Hive's control, Daisy helps kidnap Holden Radcliffe so he can build Hive's army of Inhumans."],[7,8,"Radcliffe works with his android Aida to trap Daisy's friends inside the Framework, and she goes in to get them out."]]],[0,591,[[7,11,"Ian Quinn shoots Daisy Johnson on John Garrett's orders and nearly kills her."],[7,25,"In the Kree temple, the Terrigen Mist turns Quinn to stone, and he shatters when Skye's new powers erupt."]]],[0,21,[[5,25,"Isabelle Hartley's mercenary team works with Skye after S.H.I.E.L.D. falls, and Skye backs her up on the job to recover the Obelisk. When Hartley is killed after Carl Creel attacks her team, Coulson asks Skye to pack up her belongings."]]],[0,12,[[4,8,"Jeffrey Mace becomes Director of S.H.I.E.L.D. while Daisy is a fugitive vigilante and orders her brought in. Once she returns, they learn to trust each other: she saves him from the Watchdogs, and he helps clear her name."]]],[0,3,[[2,11,"Jemma Simmons and Daisy Johnson are best friends. They have been through nearly everything together since Daisy joined Coulson's team."]]],[0,598,[[0,25,"Jiaying is Daisy Johnson's mother and the leader of the Inhuman haven Afterlife. She welcomes Daisy at first, then tries to drain Daisy's life force to heal herself."]]],[0,17,[[2,9,"Daisy rescues Joey Gutierrez from the ATCU when his power to melt metal first emerges, and S.H.I.E.L.D. helps him learn to control it. He joins her Secret Warriors and answers when she calls him to help rescue S.H.I.E.L.D. agents."]]],[0,587,[[7,11,"John Garrett, the Clairvoyant, orders Ian Quinn to shoot Skye, leaving her near death. After Garrett is exposed as Hydra, Skye helps turn Deathlok against him, and Deathlok kills him."]]],[0,595,[[7,25,"Kara Palamas, brainwashed by Hydra as Agent 33, fights Skye in Vancouver and gets the better of her until Lance Hunter steps in. Skye urges her to stand down and accept S.H.I.E.L.D.'s help, but Kara refuses."]]],[0,608,[[7,26,"Kasius tries to sell Daisy Johnson to buyers and makes her fight for him."]]],[0,7,[[2,25,"Lance Hunter joins Coulson's team after S.H.I.E.L.D. falls and becomes a good friend to Skye, trading stories about his ex-wife and her old crush on Grant Ward. Early on, he knocks her out with an I.C.E.R. so he can go after Carl Creel himself."]]],[0,2,[[2,11,"Fitz and Skye become close friends on Coulson's team."],[2,25,"When Skye gains her powers, Fitz is the first to help her hide them."],[2,28,"Daisy spends a year searching space to bring Fitz home."]]],[0,8,[[1,25,"Lincoln Campbell guides Daisy Johnson through her change into an Inhuman at Afterlife, and the two grow close."],[1,9,"Daisy and Lincoln fall in love, and he gives his life to save her and the world from Hive."]]],[0,87,[[5,11,"After S.H.I.E.L.D. falls, Maria Hill helps Coulson's team escape Glenn Talbot's soldiers. She then chases Grant Ward down in a jump jet when he tries to deliver Skye to John Garrett."]]],[0,1,[[3,11,"Melinda May is Daisy Johnson's supervising officer and trains her to fight. Over the years they become close friends who trust each other with their lives."]]],[0,11,[[2,11,"After HYDRA turns Mike Peterson into the cyborg Deathlok, Daisy Johnson helps Coulson's team free him. He later fights beside her as one of S.H.I.E.L.D.'s most loyal allies."]]],[0,57,[[4,11,"Nick Fury runs S.H.I.E.L.D. when Skye joins Phil Coulson's team, and he warns Coulson that the former Rising Tide hacker is a risk. After S.H.I.E.L.D. falls, Fury turns up to help the team bring down John Garrett."]]],[0,56,[[3,11,"Phil Coulson recruits Daisy Johnson into S.H.I.E.L.D. and becomes a father figure to her. She grows from a hacker on his plane into one of his most trusted agents."]]],[0,25,[[5,9,"Piper is a S.H.I.E.L.D. agent who shoots Daisy with an I.C.E.R. while Hive has her under his control."],[2,28,"Piper has become a trusted friend, and she joins Daisy on the year-long search through space for Leo Fitz."]]],[0,590,[[6,11,"Raina, the Centipede scientist in the flower dress, is obsessed with Skye's true nature and believes their destinies are linked."],[6,25,"Both go through Terrigenesis in the Kree city, and at the Inhumans' Retreat Raina's visions expose Jiaying's plans to Skye just before Jiaying kills her."]]],[0,13,[[2,8,"Daisy Johnson hunts for the Ghost Rider as a vigilante, and Robbie Reyes first treats her as an enemy. They become friends and allies against his uncle Eli Morrow."]]],[0,22,[[6,25,"Robert Gonzales leads the rival S.H.I.E.L.D. that sees Skye's new powers as a threat and sends Bobbi Morse to bring her in. He later comes to the Inhumans' Retreat to make peace, where Skye's mother Jiaying kills him."]]],[0,29,[[2,9,"Daisy looks out for Robin Hinton, the young seer whose father died helping S.H.I.E.L.D., and gives her a carved robin he made for her."],[2,26,"When HYDRA captures Phil Coulson, Daisy takes Robin out of hiding to help find him."]]],[0,16,[[6,9,"Rosalind Price runs the ATCU, the task force that locks up new Inhumans, and Daisy distrusts her even after Coulson forms an alliance with her. When Rosalind falls during an attack, Daisy catches her with her powers and saves her life."]]],[0,611,[[7,26,"Ruby Hale is raised to see Quake as the rival she must beat to earn her mother's approval. She hunts Daisy down and attacks her with her chakram blade."]]],[0,74,[[6,25,"Sif comes to Earth to stop the Kree warrior Vin-Tak, who wants to kill Skye after her powers emerge, and Sif decides Skye should be taken to Asgard. She relents only after seeing Skye risk herself to protect her friends."]]],[0,609,[[7,26,"Sinara, Kasius' Kree enforcer at the future Lighthouse, helps capture Daisy so she can be sold to the highest bidder. The two fight more than once, and Daisy finally kills her."]]],[0,680,[[7,26,"The Doctor insists on cutting Daisy Johnson's power inhibitor out of her, whatever the pain."]]],[0,602,[[7,8,"Anton Ivanov, the Superior, leads the Watchdogs in killing Inhumans, and Quake fights him and his men head on. She cripples him in battle, though he keeps coming back through his robot duplicates."]]],[0,679,[[7,8,"Tucker Shockley is an Inhuman who hates his own kind and works with the Watchdogs. He attacks Quake with his taser rod while stealing the Darkhold, and she takes him down more than once."]]],[0,18,[[4,11,"Victoria Hand takes command of the Bus during the search for the kidnapped Phil Coulson and sends Skye off the plane after she hacks without permission. Skye pushes back, insisting that finding Coulson matters more than protocol."]]],[0,674,[[7,25,"Vin-Tak, a Kree warrior, comes to Earth to wipe out the power of the Inhumans and sees Skye as a weapon that must be destroyed. He hunts her through the Playground until Sif and Coulson's team stop him."]]],[220,212,[[1,10,"Dane Whitman is Sersi's boyfriend and a fellow museum worker in London. He asks her to move in with him just before Arishem takes her away."]]],[220,496,[[2,10,"Sprite is Dane Whitman's friend through Sersi, and she teases them both about their romance."]]],[684,324,[[7,14,"Daniel Blake is Mayor Fisk's aide, who helps Fisk paint Daredevil as a terrorist."]]],[684,414,[[4,15,"Daniel Blake talks his way onto Fisk's mayoral campaign through Sheila Rivera, the campaign manager, who takes him on because he will work cheap. They go on to work side by side in Fisk's office, and Rivera has her doubts when Fisk promotes Blake to deputy mayor for communications."]]],[684,538,[[4,15,"Daniel Blake is a young admirer who joins Fisk's campaign and rises on his staff. Fisk forgives him once for a leak."],[7,14,"Fisk's people murder Blake, and the truth about his death helps turn the city against Fisk."]]],[166,467,[[7,71,"Daniel Drumm once trains alongside Kaecilius at Kamar-Taj. After Kaecilius betrays the Masters of the Mystic Arts, he storms the New York Sanctum and kills Drumm, its protector."]]],[32,614,[[7,32,"Dottie Underwood is a Leviathan assassin who fights Daniel Sousa in an office stairwell and escapes him."],[7,24,"In Los Angeles, Sousa and Peggy Carter capture Dottie and force her to help them against Whitney Frost, but she gets away again."]]],[32,33,[[6,32,"Daniel Sousa first meets Edwin Jarvis as a suspect while the S.S.R. hunts Howard Stark, and Jarvis secretly gives Sousa a tip in a fake American accent."],[5,24,"In Los Angeles, Sousa and Jarvis become allies, working with Peggy Carter against Whitney Frost."]]],[32,45,[[6,32,"Daniel Sousa hunts Howard Stark for the SSR, which believes Howard sold his weapons to enemies overseas."],[5,24,"Howard has since been cleared, and in Los Angeles he helps Daniel's team fight Whitney Frost and her Zero Matter."]]],[32,35,[[5,32,"Daniel Sousa and Jack Thompson are fellow S.S.R. agents who often clash. Driven mad by the Midnight Oil gas, Sousa tries to kill Thompson, but the two later team up with Peggy Carter to stop Johann Fennhoff."],[5,24,"In Los Angeles, Sousa and Thompson team up with Peggy Carter again to stop Whitney Frost."]]],[32,3,[[5,27,"When Jemma poses as Peggy Carter at the S.S.R. in 1955, Daniel Sousa sees through the act and arrests her. After the team saves him from the death history had planned for him, he joins them aboard Zephyr One."]]],[32,613,[[7,32,"Daniel Sousa unknowingly interrupts Johann Fennhoff, posing as Dr. Ivchenko, while he is hypnotizing Chief Dooley. At Stark's warehouse Sousa corners Fennhoff at gunpoint, and Fennhoff tries to talk his way into Sousa's mind."]]],[32,617,[[5,24,"Daniel Sousa and Peggy Carter fight their way past Joseph Manfredi's guards and pressure the mob boss into helping them against Whitney Frost, his former lover. Manfredi ends up working with them."]]],[32,1,[[5,27,"When Daniel Sousa joins ng the Red Room down."]]],[457,89,[[7,20,"Dreykov raises Natasha as an assassin in the Red Room. She defects by trying to kill him in Budapest, and years later she returns to free the Widows and destroy the Red Room."]]],[457,458,[[0,20,"Dreykov is Antonia Dreykov's father. He turns her into Taskmaster and controls her."]]],[457,640,[[4,20,"Dreykov controls the Black Widows with a chemical that takes over their minds."]]],[457,296,[[7,65,"In 1998, Varra spies on Dreykov for Nick Fury and brings him intelligence on Dreykov's men."]]],[457,146,[[7,20,"Dreykov takes Yelena into the Red Room as a child and keeps her under chemical mind control as one of his Widows. Once she is freed, she turns on him and kills him as the Red Room falls."]]],[217,495,[[6,10,"Druig defies Ikaris during the fall of Tenochtitlan, using his mind control to end the fighting despite Ikaris's order to stop, and then leaves the Eternals. Centuries later, when Druig's power becomes the key to halting the Emergence, Ikaris turns on the team to stop him."]]],[217,221,[[5,10,"Druig briefly takes control of Karun Patel's mind when the Eternals visit his compound in the Amazon."]]],[217,494,[[7,10,"Kro leads a pack of Deviants against Druig's compound in the Amazon."]]],[217,216,[[1,10,"Makkari and Druig have feelings for each other. They reunite after centuries, and in the end they leave Earth together on the Domo."]]],[217,212,[[5,10,"Sersi seeks out Druig at his compound in the Amazon and asks him to help stop the Emergence. He agrees to use his powers to put the Eternals to sleep if needed."]]],[49,45,[[2,80,"Dum Dum Dugan knows Howard Stark from the war against HYDRA. In 1946 he lounges by the pool with Howard while Howard calls the SSR to name Peggy Carter head of the new S.H.I.E.L.D."]]],[49,44,[[2,36,"Dum Dum Dugan fights alongside Peggy Carter in the war against HYDRA, and the two become close friends."],[2,32,"After the war, Dugan and the Howling Commandos join Peggy on the SSR's mission int e who understands her when she jokes in Chinese."]]],[540,324,[[7,33,"James Wesley is Wilson Fisk's right-hand man, who brings Matt and Foggy a client as a front for Fisk's plans."]]],[540,334,[[4,33,"James Wesley passes Fisk's orders to Melvin Potter, who makes Fisk's suits."]]],[540,543,[[5,33,"James Wesley handles Wilson Fisk's dealings with Nobu Yoshioka, who represents the Hand in Fisk's criminal alliance. Wesley is never sure what Nobu's people actually contribute, even though they take an equal share of the profits."]]],[540,549,[[5,33,"James Wesley pays Turk Barrett for feeding a story to Vladimir Ranskahov."]]],[540,539,[[5,33,"James Wesley looks after Vanessa for Fisk and keeps her close to the business. She relies on him when Fisk breaks down."]]],[540,545,[[7,33,"James Wesley deals with the Ranskahov brothers for Fisk, then works to wipe out Vladimir's operation."]]],[540,538,[[4,33,"James Wesley is Wilson Fisk's right-hand man and his closest friend. He runs the details of Fisk's empire until Karen Page kills him."]]],[67,76,[[5,75,"Jane Foster slaps Loki for the attack on New York when they finally meet. They escape Asgard together with Thor, and Loki fakes betraying her to Malekith as part of the plan to destroy the Aether."]]],[67,431,[[7,75,"Malekith hunts Jane Foster because the Aether, the weapon he needs to plunge the Nine Realms into darkness, has bonded with her. He draws it out of her on Svartalfheim, and Jane then helps Thor stop him during the Convergence in Greenwich."]]],[67,66,[[1,73,"Jane Foster and Thor fall in love after he lands in New Mexico."],[1,39,"Jane and Thor split up for years, and when they meet again she is wielding Mjolnir herself as the Mighty Thor."]]],[67,77,[[2,39,"Valkyrie fights beside Jane Foster after Jane takes up Mjolnir as the Mighty Thor. They bond over battle and back each other up against Gorr."]]],[305,303,[[2,7,"Janelle Jackson is Simon Williams' agent at the Hanover Agency and finds him his early roles. The  atomic test reopens the rift, it is Wilkes, not Frost, who absorbs the extra Zero Matter."]]],[650,325,[[5,49,"Karen Page tries to get Jasper Evans to tell the press that Fisk paid him to stab him."]]],[650,324,[[5,49,"Matt Murdock tracks Jasper Evans down to learn the truth about the prison stabbing."]]],[650,538,[[7,49,"Fisk sets up fellow inmate Jasper Evans to stab him, so he can strike a deal with the FBI. He later has Benjamin Poindexter kill Evans."]]],[449,87,[[4,63,"As Nick Fury's deputy director, Maria Hill outranks Jasper Sitwell, and both work the Helicarrier's bridge during the hunt for Loki."],[7,17,"When S.H.I.E.L.D. falls, Sitwell is exposed as a HYDRA mole inside the agency Hill helped run."]]],[449,89,[[7,17,"Jasper Sitwell serves alongside Natasha at S.H.I.E.L.D. Once she and Steve learn he is Hydra, they abduct him and force him to reveal the truth about Project Insight."]]],[449,56,[[2,86,"Jasper Sitwell is one of Phil Coulson's trusted S.H.I.E.L.D. colleagues, and together they scheme to sink the World Security Council's plan to recruit Emil Blonsky."],[7,11,"When HYDRA rises inside S.H.I.E.L.D., Coulson learns that his old colleague Sitwell has been HYDRA all along."]]],[449,121,[[7,17,"Sam Wilson helps Steve and Natasha capture Jasper Sitwell, catching him in midair after Natasha kicks him off a roof."]]],[449,42,[[7,17,"Jasper Sitwell works alongside Steve Rogers at S.H.I.E.L.D., including on the Lemurian Star rescue. Once Steve learns Sitwell is HYDRA, he and Natasha force him to reveal Project Insight's targets."]]],[449,18,[[4,11,"Jasper Sitwell works at the Hub under Victoria Hand, greeting Coulson's team and tracking missions for her. When he is ordered to the Lemurian Star, Hand heads back to the Hub rather than take his place on the hunt."]]],[201,658,[[7,54,"Jean DeWolff investigates the crime lord Tombstone. Spider-Man hands her the evidence she needs, and she taunts Tombstone as he is taken into custody."]]],[201,150,[[2,54,"Jean er his faction takes over the Playground, he hands her Coulson's Toolbox to crack with Anne Weaver. Jemma stays loyal to Coulson throughout the standoff."]]],[3,611,[[7,26,"Ruby Hale captures Jemma and Fitz and forces them to work on Hydra's Gravitonium project. Jemma warns her where it leads, having seen that future herself, but Ruby will not listen and later tries to kill her."]]],[3,609,[[7,26,"Sinara takes Jemma Simmons into Kasius' service after seeing her treat a wounded servant. When Kasius decides that servant, Reese, is no longer perfect, Sinara executes him on his order, to Jemma's horror."]]],[3,594,[[7,25,"Sunil Bakshi is Jemma Simmons' superior while she spies inside HYDRA, and he never suspects she works for S.H.I.E.L.D. Later, when Jemma tries to kill Grant Ward, Bakshi steps in to save Ward and is killed by accident."]]],[3,680,[[7,8,"The Doctor, the dark Hydra side of Fitz's mind, tortures Jemma Simmons inside a mental simulation."]]],[3,679,[[7,8,"Tucker Shockley orders Jemma Simmons killed after she saves Vijay Nadeer during his Terrigenesis. She later goes up against Shockley herself in S.H.I.E.L.D.'s fight with the Watchdogs."]]],[3,18,[[4,11,"Victoria Hand puts Jemma Simmons and Trip to work at the Hub during the hunt for the Clairvoyant. When Hydra rises, Hand poses as Hydra and orders them to pledge their loyalty, a test the two pass by standing firm."]]],[3,28,[[1,9,"Will Daniels is an astronaut stranded on the planet Maveth, where Jemma Simmons is trapped with him for months. They fall for each other, but Hive kills him and takes his body."]]],[180,179,[[2,4,"Lilia Calderu and Jennifer Kale become friends while walking the Witches' Road. Lilia calls Jen \"the High Priestess\" when they meet."]]],[180,525,[[5,4,"Rio Vidal walks the Witches' Road with Jennifer Kale as the coven's Green Witch before revealing that she is Death."]]],[265,514,[[5,38,"Jennifer represents Leap-Frog in a lawsuit against his tailor Luke Jacobson. When he loses, he kidnaps Luke, and Jennifer helps rescue him."]]],[265,274,[[5,38,"Luke Jacobson is the superhero tailor who designs Jennifer's She-Hulk suit, after she opposes him in court."]]],[265,272,[[2,38,"Madisynn King testifies for Jennifer in Wong's case. The party-loving Madisynn then drags Jennifer into a night out, and they become friends."]]],[265,268,[[5,38,"Mallory Book is a rival attorney at GLK&H. She later represents Jennifer in her case against Titania."]]],[265,324,[[2,38,"Matt Murdock faces Jennifer in court over a superhero suit, then teams up with her against Leap-Frog. They spend a night together and date briefly while he is in town, and she brings him to meet her family."]]],[265,271,[[0,38,"Morris Walters is Jennifer's father. When she loses her job after becoming She-Hulk, he hosts a family dinner, tells her it will be okay, and jokes that at least she has not destroyed a city like her cousin Bruce."]]],[265,266,[[2,38,"Nikki Ramos is Jennifer's paralegal and best friend, first at the district attorney's office and then at GLK&H. She pushes Jennifer to embrace She-Hulk, from stopping Titania in the courtroom to walking into a bar full of fans."]]],[265,275,[[0,38,"Skaar is Bruce Banner's son, making him Jennifer's cousin once removed. Bruce introduces him at a Walters family barbecue."]]],[265,513,[[6,38,"Titania brawls with Jennifer Walters and sues her over the trademark for the name She-Hulk."]]],[265,512,[[7,38,"Todd Phelps dates Jennifer Walters while secretly running Intelligencia, as HulkKing. He tries to steal her blood and expose her."]]],[265,162,[[5,38,"Wong first deals with Jennifer Walters when he is called as a witness at Emil Blonsky's parole hearing. He later hires her to sue Donny Blaze for misusing magic, and she wins him the case."]]],[309,527,[[7,68,"Jentorra leads the rebellion against Kang the Conqueror, who conquered her people."]]],[309,311,[[4,68,"Jentorra leads the freedom fighters, and the mind-reader Quaz is one of her fighters." st."]]],[100,42,[[5,13,"Nebula joins Steve Rogers and the surviving Avengers after returning to Earth with Tony Stark. She leads them to Thanos on his garden planet and goes on the Time Heist."]]],[100,437,[[5,40,"Nebula joins Taserface's mutiny against Yondu, stopping Taserface from killing Rocket and shooting Yondu's control fin off. Once she has a ship, she leaves the Ravagers to hunt down Gamora."]]],[100,429,[[0,74,"Thanos adopts Nebula and replaces parts of her body each time she loses to Gamora, and she grows to hate him."],[7,42,"Thanos catches Nebula sneaking aboard his ship and tortures her until Gamora gives up the Soul Stone's location. Nebula escapes and joins the fight against him on Titan."],[7,13,"After the Snap, Nebula leads the Avengers to Thanos and helps them defeat him in the Battle of Earth."]]],[100,508,[[7,3,"The High Evolutionary captures Nebula, Drax and Mantis aboard his ship and threatens them to make Quill hand over Rocket. Nebula fights with the Guardians to bring him down and free his captives."]]],[100,52,[[5,42,"Nebula and Tony Stark are left behind on Titan together after Thanos wins."],[2,13,"Stranded in space on the way home, Nebula and Tony become friends, and she plays paper football with him to pass the time."]]],[100,99,[[7,40,"Nebula sides with Taserface's mutiny against Yondu and shoots the control fin off his head. Later they end up on the same side in the battle against Ego."]]],[152,150,[[2,1,"Ned Leeds is Peter Parker's best friend from school. Once he learns Peter's secret, he helps him from behind a computer as his guy in the chair."],[2,6,"Ned helps Peter face the villains from other worlds. To save the world, Peter has everyone forget him, and Ned says a tearful goodbye to his best friend."],[2,54,"Years later Ned, who no longer remembers Peter, tracks Spider-Man's sightings with an app he built. He finally meets the hero face to face, and then meets Peter again."]]],[152,157,[[3,1,"Roger Harrington is Ned's teacher ave Rocket and ends up killing him."]]],[94,106,[[2,74,"Rhomann Dey has arrested Quill before and teases him by calling him \"Star-Prince.\" When Quill warns that Ronan is coming for Xandar, Dey vouches for him to the Nova Corps."]]],[94,97,[[2,74,"Rocket and Groot first try to collect the bounty on Peter Quill, and the three end up founding the Guardians of the Galaxy together. Quill and Rocket bicker constantly but become close friends."],[2,3,"Quill leads the Guardians' desperate mission to save Rocket's life, and afterward he hands Rocket leadership of the team before going home to Earth."]]],[94,433,[[7,74,"Peter Quill distracts Ronan with a dance-off, and the Guardians then use the Power Stone to destroy him."]]],[94,161,[[5,42,"On Titan, Quill and Stephen Strange first face off, each thinking the other works for Thanos, then join forces to ambush him."]]],[94,437,[[7,40,"Taserface serves in Yondu's Ravager crew while Peter grows up there, and resents how Yondu keeps protecting Peter even after he betrays the clan. That grudge fuels Taserface's mutiny, and he orders the Ravagers to hunt down and kill the Guardians."]]],[94,429,[[7,42,"Peter Quill attacks Thanos on Titan after learning he killed Gamora, which ruins the plan to take the Gauntlet. Quill is later wiped out by the snap."]]],[94,634,[[7,40,"The Sovereign hire Peter Quill and the Guardians to stop the Abilisk, a giant space monster feeding on their batteries, and they kill it."]]],[94,632,[[5,74,"The Collector offers four billion units for the Orb, and Peter Quill and his crew bring it to him on Knowhere. The deal falls apart when his servant Carina grabs the Infinity Stone inside and it destroys much of his museum."]]],[94,508,[[7,3,"Quill leads the Guardians against the High Evolutionary to save Rocket's life. Confronting him at his base, Quill calls out the flaws in his Counter-Earth, and the Guardians go on to defeat him."]]],[94,66,[[6,42,"Peter Quill feels threatened when the Guardians pick Thor up in space and starts deepening his voice to compete."],[2,39,"After the war with Thanos, Thor travels with the Guardians, and the two part as friends."]]],[94,52,[[5,42,"Peter Quill and Tony Stark meet in a standoff on Titan before realizing they are both fighting Thanos. Their plan to pull off the Infinity Gauntlet falls apart when Quill learns Gamora's fate and attacks Thanos in a rage."]]],[94,99,[[0,74,"Yondu Udonta takes Peter Quill from Earth as a boy and raises him as a Ravager. When the grown Quill cuts him out of the deal for the Orb, Yondu hunts him across the galaxy, then lets him go after the battle of Xandar."],[0,40,"Yondu reveals he kept young Peter from his father Ego, and he gives his life to save Peter, who finally sees him as his real father."]]],[215,212,[[5,10,"Sersi and Ikaris visit Phastos at his home in Chicago and convince him to rejoin the Eternals."]]],[56,25,[[4,9,"Piper joins Phil Coulson's task force to take out Hive, telling him her gun's safety was never on."],[6,26,"Years later she lures his team into General Hale's trap at a Kree beacon. When Coulson tells her to pick a side, she turns back to S.H.I.E.L.D."]]],[56,590,[[7,11,"Raina has Centipede kidnap Phil Coulson and puts him in a memory machine to dig out the secret of his return from the dead, until Skye rescues him."],[7,25,"Raina tries to blackmail Coulson into helping her get the Diviner."]]],[56,13,[[5,8,"Phil Coulson first tracks Robbie Reyes, the new Ghost Rider, as a dangerous killer, but learns he lives by a code. They team up against Eli Morrow and Aida, and Coulson even makes his own deal with the Spirit of Vengeance to stop Aida."]]],[56,22,[[6,25,"Robert Gonzales leads the rival S.H.I.E.L.D. that seizes Coulson's base and demands his Toolbox of secrets. Once Coulson proves himself, they agree to merge their factions, and Gonzales is killed soon after while trying to make peace with the Inhumans."]]],[56,16,[[1,9,"Rosalind Price leads the ATCU, and she and Phil Co  mind. When he tricks Vision into giving up control of his body, he takes Tommy."]]],[177,485,[[0,5,"Tommy is the son of Wanda and the Vision she recreates in the Hex."],[0,81,"Years later White Vision, who first hunts Tommy, becomes a father figure to him."]]],[177,90,[[0,5,"Tommy Maximoff is one of the twin sons Wanda Maximoff creates with her magic in Westview. When she brings down the hex, she has to let him go."]]],[644,549,[[5,58,"Turk Barrett texts Tone, Cottonmouth's bodyguard, to tell him where Chico Diaz is hiding."]]],[52,452,[[7,46,"Tony Stark builds Ultron to protect the world, but Ultron turns on him and the Avengers and tries to wipe out humanity."]]],[52,453,[[7,46,"Tony Stark once nearly sold Stark Industries weapons to arms dealer Ulysses Klaue, so he knows Klaue is the man Strucker's trail leads to. The Avengers track Klaue to his salvage ship just after Ultron cuts off his arm."]]],[52,445,[[7,16,"Vice President Rodriguez secretly backs Aldrich Killian's plot against Tony Stark and the President, in exchange for Extremis to heal his daughter. He is arrested once Tony and Rhodey stop Killian."]]],[52,485,[[5,46,"Tony Stark and Bruce Banner bring Vision to life by uploading what is left of J.A.R.V.I.S. into a synthetic body, and Vision fights beside Tony against Ultron."],[5,44,"Vision sides with Tony over the Sokovia Accords and fights for him at the Leipzig airport."]]],[52,90,[[6,46,"Wanda Maximoff blames Tony Stark for her parents' deaths, since a Stark shell left her trapped in the rubble as a child, and she plants the vision that drives him to build Ultron."],[6,44,"Wanda is now an Avenger, but Tony has her kept at the compound under the Sokovia Accords, and she sides with Steve against him."]]],[52,488,[[4,2,"William Ginter Riva is a Stark Industries scientist who fails to rebuild Tony Stark's miniature arc reactor for Obadiah Stane, who reminds him Tony built one in a cave."],[7,52,"Feeling overlooked by the company, Riva later helps Quentin Beck scheme against Tony's legacy."]]],[52,162,[[5,42,"Wong and Tony Stark team up with Stephen Strange against Ebony Maw and Cull Obsidian in New York. Wong saves Tony by sending Cull Obsidian through a portal to Antarctica."]]],[639,77,[[6,62,"Topaz, the Grandmaster's bodyguard, openly despises Valkyrie and calls her trash when she delivers Thor. When Valkyrie helps lead the rebellion on Sakaar, Topaz reports it to the Grandmaster and joins the chase."]]],[120,304,[[5,7,"Trevor Slattery wins over the director Von Kovak and lands a part alongside Simon in the Wonder Man remake."]]],[120,498,[[7,76,"Trevor Slattery played a fake version of the Mandarin, and Wenwu has him locked up for it."]]],[120,227,[[5,76,"Xialing breaks Trevor out of Wenwu's cell along with Shang-Chi and Katy, and they escape in Razor Fist's car to Ta Lo."]]],[346,558,[[1,60,"Will Simpson tries to kill Trish while under Kilgrave's control. Afterward they start a romance that ends when he becomes violent."]]],[549,545,[[5,33,"Turk Barrett does business with Vladimir's Russian mob before they turn on each other."]]],[549,538,[[4,33,"Turk Barrett runs jobs for Fisk's organization, including a human trafficking shipment. He is arrested when Fisk's operation is exposed."]]],[256,254,[[0,0,"Tyesha Hillman marries Yusuf's son Aamir, making her Yusuf's daughter-in-law."]]],[484,485,[[7,5,"Tyler Hayward takes Vision's body after his death, refuses to let Wanda bury him, and spends years trying to rebuild him as a S.W.O.R.D. weapon. Using energy from Westview, he finally brings him back as the White Vision and sends him to destroy Wanda's Vision."]]],[484,90,[[7,5,"Tyler Hayward treats Wanda Maximoff as a threat. He fires a missile at her and builds the White Vision to use against her."]]],[452,453,[[5,46,"Ultron buys Ulysses Klaue's entire stock of vibranium for his plan. When Klaue compares him to Tony Stark, Ultron flies into a rage and cuts off his arm."]]],[452,485,[[7,46,"Vision is created from th  life with him."]]],[545,538,[[7,33,"Vladimir Ranskahov partners with Fisk until Fisk murders his brother Anatoly. Vladimir then turns on Fisk and dies fighting his men."]]],[90,162,[[7,29,"Wanda lays siege to Kamar-Taj while hunting America Chavez and knocks Wong aside. She captures him and forces him to lead her to Mount Wundagore, where he reveals the Darkhold's origins to spare the other sorcerers."]]],[498,227,[[0,76,"Wenwu is Xialing's father. He ignores her as a child, and she takes over the Ten Rings after his death."]]],[498,228,[[0,76,"Wenwu is Ying Nan's brother-in-law. She fights him and his army when he attacks Ta Lo to open the Dark Gate."]]],[538,685,[[4,56,"Zane is one of Fisk's men in Oklahoma. Fisk orders him to stand down just before he executes Maya Lopez and her uncle."]]],[227,228,[[0,76,"Ying Nan is Xialing's aunt, her mother's sister, and welcomes her to Ta Lo."]]]],"places":{"14":"The Reyes family","27":"Phil Coulson's loved ones","29":"S.H.I.E.L.D.","31":"The Lighthouse","34":"The Jarvis household","51":"The Stark family","58":"The Ten Rings' prisoners","67":"New Asgard","70":"Jane Foster's research team","84":"The Barton family","85":"The Barton family","86":"The Barton family","103":"Knowhere","104":"The Quill family","105":"The Quill family","115":"S.A.B.E.R.","119":"Tony Stark's friends and family","127":"The Lang family","128":"The Lang family","149":"Natasha Romanoff's contacts","152":"Midtown High","154":"Midtown High","155":"Midtown High","159":"Peter Parker's suit","160":"The Stark family","177":"The Maximoff family","182":"The Kaplan family","183":"The Kaplan family","184":"The Kaplan family","186":"Tommy and Lisa's street crew","190":"The Bradley family","195":"Bucky's Brooklyn neighborhood","197":"Midtown High","199":"Nick Fury's team","203":"Kate Bishop's household","204":"Matt's resistance","206":"The Bishop family","211":"Stephen Strange's allies","221":"Kingo's entourage","222":"Phastos' family","223":"The Eternals","224":"T
