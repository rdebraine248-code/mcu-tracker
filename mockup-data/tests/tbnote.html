<div id="tbNote" hidden style="position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:200;max-width:460px;margin:0 auto;padding:14px 16px;border:1px solid #3A78C9;border-radius:12px;background:#0D1320;color:#D5DCE8;font:14px/1.45 'IBM Plex Sans Condensed','Arial Narrow',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)">
  <div style="font:11px/1.4 'Share Tech Mono','Courier New',monospace;letter-spacing:2px;text-transform:uppercase;color:#7FA6D8">Test build</div>
  <p style="margin:6px 0 10px" id="tbMsg">Your real datapad isn't touched.</p>
  <button type="button" id="tbOk" style="padding:8px 14px;border:1px solid #3A78C9;border-radius:999px;background:#13213A;color:#CFE4FF;font:12px/1 'Share Tech Mono','Courier New',monospace;letter-spacing:2px;text-transform:uppercase">Got it</button>
</div>
<script>
document.getElementById("tbMsg").innerHTML = TB_MSG;
try { if (localStorage.getItem("tb-note") && typeof newsTitles === "function") { state.news = state.news || {}; newsTitles().forEach(x => NEWS[x].forEach((h, i) => { state.news[newsKey(x, i)] = 1; })); persist(); } } catch (e) {}   // every news story already heard
try { if (localStorage.getItem("tb-note")) { const n = document.getElementById("tbNote"); n.hidden = false; document.getElementById("tbOk").onclick = () => { n.hidden = true; try { localStorage.removeItem("tb-note"); } catch (e) {} }; } } catch (e) {}
</script>
