<title>MCU Watch Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10141D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:ital,wght@1,800&amp;family=Bebas+Neue&amp;family=Big+Shoulders+Display:wght@800&amp;family=Bungee&amp;family=Chakra+Petch:wght@700&amp;family=Cinzel:wght@700&amp;family=Cormorant+Garamond:ital,wght@0,700;1,700&amp;family=Fraunces:ital,wght@0,700;1,700&amp;family=IBM+Plex+Mono:wght@600&amp;family=IBM+Plex+Sans+Condensed:ital,wght@0,500;1,500&amp;family=Kaushan+Script&amp;family=Ma+Shan+Zheng&amp;family=Oswald:wght@700&amp;family=Playfair+Display:wght@700&amp;family=Rajdhani:wght@700&amp;family=Righteous&amp;family=Russo+One&amp;family=Saira+Stencil+One&amp;family=Share+Tech+Mono&amp;family=Special+Elite&amp;family=Teko:wght@600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --shell:#10141D; --ink:#EEF1F6; --muted:#9AA3B2; --line:#2A3140; --chip:#1A2030; --chip-ink:#EEF1F6;
  color-scheme: dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
@media (prefers-color-scheme: dark){ :root{ color-scheme: dark; } }
*{ -webkit-tap-highlight-color: transparent; }
.tile, .cover, .panel, .toast, .tile *, .panel *{ color-scheme: only light; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100vh; background-color:var(--shell); color:var(--ink); font-family:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; top:0; left:0; width:100%; height:100vh; height:100lvh; z-index:-1; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1.4px),
                   radial-gradient(1100px 620px at 88% -12%, rgba(64,108,214,0.22), transparent 62%),
                   radial-gradient(900px 560px at -8% 108%, rgba(196,40,52,0.16), transparent 60%);
  background-size:14px 14px, 100% 100%, 100% 100%; }
button{ font:inherit; color:inherit; }
.wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 64px; }

/* masthead */
.mast{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:18px 28px; padding-bottom:20px; border-bottom:1px solid var(--line); }
.mast h1{ margin:0; font-family:'Anton','Impact',sans-serif; font-weight:400; font-size:clamp(40px,7.2vw,80px); line-height:.95; letter-spacing:1px; text-transform:uppercase; color:#FFFFFF; text-shadow:0 3px 0 rgba(0,0,0,.35); }
.mast h1::after{ content:""; display:block; width:100%; height:4px; margin-top:12px;
  background:linear-gradient(90deg,#7D4FA8 0%,#7D4FA8 13%,#3A78C9 20%,#3A78C9 30%,#C8443A 37%,#C8443A 47%,#D9822B 54%,#D9822B 63%,#3E9B5C 70%,#3E9B5C 80%,#D9B32B 87%,#D9B32B 100%); }
.mast .sub{ margin:8px 0 0; color:var(--muted); font-size:16px; }
.meter{ min-width:220px; flex:0 1 300px; }
.meter .num{ font-family:'Anton','Impact',sans-serif; font-weight:400; font-size:30px; line-height:1; }
.meter .num .nowline{ display:block; font-family:'IBM Plex Sans Condensed','Arial Narrow',sans-serif; font-size:18px; font-weight:500; line-height:1.25; color:var(--ink); }
.meter .num small{ font-family:'IBM Plex Sans Condensed','Arial Narrow',sans-serif; font-size:16px; color:var(--muted); font-weight:500; }
.mstatus:empty{ display:none; }
.mstatus{ margin-top:8px; font-size:12.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted); line-height:1.5; }
.upnext{ margin-top:10px; display:flex; align-items:baseline; gap:8px; max-width:100%; border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer; text-align:left; }
.upnext[hidden]{ display:none; }
.upnext .ul{ font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.upnext .ut{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.upnext:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
.mstatus b{ color:var(--ink); font-weight:600; }
.meter .barrow{ display:flex; align-items:center; gap:10px; margin-top:8px; }
.meter .pct{ font-family:'Anton','Impact',sans-serif; font-weight:400; font-size:20px; min-width:3.2ch; text-align:right; }
.meter .bar{ flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
.meter .bar span{ display:block; height:100%; width:0; background:linear-gradient(90deg,#7D4FA8 0%,#7D4FA8 13%,#3A78C9 20%,#3A78C9 30%,#C8443A 37%,#C8443A 47%,#D9822B 54%,#D9822B 63%,#3E9B5C 70%,#3E9B5C 80%,#D9B32B 87%,#D9B32B 100%); background-size:var(--full,100%) 100%; transition:width .5s ease; }

/* mode switch */
.modes{ display:flex; justify-content:space-between; gap:10px; margin:22px 0 6px; }
.modes button{ touch-action:manipulation; -webkit-user-select:none; user-select:none; flex:0 1 auto; border:1px solid var(--line); background:var(--chip); padding:11px 18px; border-radius:999px; font-weight:500; font-size:16px; cursor:pointer; color:var(--ink); white-space:nowrap; }
.modes button[aria-pressed="true"]{ background:var(--ink); color:var(--shell); border-color:var(--ink); }
.modes button:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
@media (max-width:420px){ .modes button{ padding:10px 12px; font-size:15px; } }

/* sections + grid */
.saga{ margin-top:30px; }
.saga h3.reveal{ animation:sagaIn 1.8s cubic-bezier(.45,0,.25,1) both; }
.saga .note.reveal{ animation:sagaIn 1.8s cubic-bezier(.45,0,.25,1) .2s both; }
@keyframes sagaIn{ from{ opacity:0; } to{ opacity:1; } }
.saga .note{ margin:-8px 0 14px; color:var(--muted); font-size:15px; }
.saga .note.open{ color:var(--ink); }
.tile.shake{ animation:shake .42s ease; }
@keyframes shake{ 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(3px); } }
.toast{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); z-index:90; max-width:min(92vw,460px);
        background:linear-gradient(90deg,#7D4FA8,#3A78C9,#C8443A,#D9822B,#3E9B5C,#D9B32B) top/100% 2px no-repeat, linear-gradient(180deg,#1A2030,#121722); color:#EEF1F6; border:1px solid #3A4458; border-radius:12px; padding:12px 18px; font-size:15px; line-height:1.35; text-align:center;
        opacity:0; pointer-events:none; transition:opacity .75s cubic-bezier(.22,.61,.36,1), transform .75s cubic-bezier(.22,1,.36,1); }
.toast .tq{ display:block; font-family:var(--qf, inherit); font-size:17px; line-height:1.35; text-transform:none; letter-spacing:.2px; }
.toast .tf{ display:block; margin-top:4px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; opacity:.75; }
.toast.show{ opacity:1; transform:translate(-50%,0); }
.saga h3{ margin:0 0 14px; font-family:'Anton','Impact',sans-serif; font-weight:400; font-size:28px; letter-spacing:1px; text-transform:uppercase; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr)); gap:18px; align-items:stretch; }

/* tiles */
.tile{ position:relative; overflow:hidden !important; contain:paint; isolation:isolate; min-height:150px; padding:14px 16px 13px 16px; display:flex; flex-direction:column; cursor:pointer; text-align:left; outline:none; transition:transform .18s ease; }
.tile.dusted{ filter:grayscale(1) brightness(.55); opacity:.38; }
.tile.dusted::after{ content:""; position:absolute; inset:0; z-index:4; background-image:radial-gradient(rgba(220,214,205,.18) 1px, transparent 1.5px); background-size:7px 6px; }
.tile.dusted:hover{ transform:none; }
.snapflash{ position:fixed; inset:0; z-index:95; background:#fff; opacity:0; pointer-events:none; }
.dustfx{ position:fixed; inset:0; z-index:94; pointer-events:none; overflow:hidden; }
.dustfx i{ position:absolute; border-radius:50%; background:#9a8f84; opacity:0; }
.mapbtn{ margin-top:22px; width:100%; display:flex; align-items:center; justify-content:center; gap:16px; padding:18px 20px; border:1px solid var(--line); border-radius:14px; cursor:pointer;
         background:linear-gradient(180deg,#141A28,#0E1320); color:#EEF1F6; font-family:'Anton','Impact',sans-serif; font-size:22px; letter-spacing:1px; text-transform:uppercase; }
.mapbtn:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
.mapbtn .mlines{ display:flex; flex-direction:column; gap:3px; width:54px; }
.mapbtn .mlines i{ display:block; height:3px; border-radius:2px; }
.tile.pressing{ transform:scale(.97); transition:transform .6s ease; }
.tile{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
@media (hover:hover) and (pointer:fine){ .tile:hover{ transform:translateY(-2px); } }
.tile:focus-visible{ box-shadow:0 0 0 3px var(--shell),0 0 0 6px var(--ink) !important; }
.hrow{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.hrow .kick{ flex-shrink:0; font-family:'IBM Plex Sans Condensed','Arial Narrow',sans-serif; font-size:11.5px; font-weight:500; letter-spacing:2px; opacity:.9; }
.hrow.big{ margin-top:26px; }
.hrow.big .kick{ font-size:13px; }
.hrow.big h2.big{ margin-top:0 !important; }
.tile .stamp{ position:absolute; top:18px; right:14px; z-index:3; transform:rotate(-11deg); padding:4px 12px 3px; border:3px double currentColor; border-radius:6px;
  font-size:17px; letter-spacing:3px; text-transform:uppercase; font-weight:700; line-height:1.1; opacity:.88; pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at 30% 40%, #000 0 55%, rgba(0,0,0,.72) 56% 100%), repeating-linear-gradient(115deg, #000 0 3px, rgba(0,0,0,.82) 3px 5px);
  mask-image:radial-gradient(circle at 30% 40%, #000 0 55%, rgba(0,0,0,.72) 56% 100%), repeating-linear-gradient(115deg, #000 0 3px, rgba(0,0,0,.82) 3px 5px); -webkit-mask-composite:source-in; mask-composite:intersect; }

  radial-gradient(ellipse 3.6% 66% at 30.2% 100%, #FFF3CC 0 92%, rgba(255,243,204,0) 100%),
  radial-gradient(ellipse 22% 135% at 30.2% 100%, rgba(255,246,216,1) 0%, rgba(255,226,154,.85) 35%, rgba(255,194,77,.35) 70%, rgba(255,182,39,0) 100%),
  linear-gradient(90deg, #FFB627 0%, #F26B1D 30%, #B3122E 100%); }
.tile .tbody{ position:relative; z-index:1; display:flex; flex-direction:column; gap:8px; margin-top:auto; padding-top:6px; }
.tile h2{ margin:0 !important; }
.tile .prog{ display:flex; align-items:center; gap:10px; font-size:14px; font-weight:500; }
.tile .pbar{ flex:1; height:4px; border-radius:2px; overflow:hidden; }
.tile .pbar span{ display:block; height:100%; }
.cover{ position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; padding:14px 16px; overflow:hidden;
        transform-origin:100% 0; transition:transform .7s cubic-bezier(.3,.1,.2,1), opacity .7s ease; }
.cover .clabel{ position:relative; z-index:2; font-family:Helvetica,Arial,sans-serif; font-weight:600; font-size:26px; letter-spacing:1px; }
.cover .ctap{ position:relative; z-index:2; font-family:Helvetica,Arial,sans-serif; font-size:13px; opacity:.72; }
.cover.csealed{ background-color:#10141D; background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.4px), radial-gradient(ellipse 90% 70% at 50% 40%, rgba(64,108,214,.16), rgba(64,108,214,0) 70%); background-size:14px 14px, 100% 100%; border:2px dashed #3A4458; }
.cover.csealed .clabel, .cover.csealed .ctap{ color:#C9D1E0; }
.cover.peel{ transform:rotate(-14deg) translate(18%,-125%); opacity:0; }

/* full-screen chapter / character view */
.panel{ position:fixed !important; inset:0 !important; z-index:50; overflow-y:auto !important; overflow-x:hidden !important; border-radius:0 !important;
        transition:clip-path .45s cubic-bezier(.2,.75,.2,1); -webkit-overflow-scrolling:touch; }
.panel[hidden]{ display:none !important; }
.pfix{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.pin{ position:relative; z-index:2; max-width:760px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top,0px)) 8px calc(90px + env(safe-area-inset-bottom,0px)); opacity:0; transition:opacity .3s ease .18s; }
.panel.open .pin{ opacity:1; }
.back{ display:inline-flex; align-items:center; gap:8px; border:1.5px solid currentColor; background:transparent; border-radius:999px; padding:8px 16px 8px 12px; font-size:15px; font-weight:500; cursor:pointer; }
.ptop{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.pquote{ transition:opacity 1.8s cubic-bezier(.22,.61,.36,1); }
